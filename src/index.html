<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New Era Expert — Content Dashboard</title>
<link rel="stylesheet" href="styles.css?v=20260828a">
</head>
<body>
<header>
  <div class="brand">
    <img src="new-era-expert-logo.png" alt="The New Era Expert" class="logo">
    <span class="page-label">Content Dashboard</span>
  </div>
  <nav class="nav">
    <a href="index.html" class="active">Topics</a>
    <a href="videos.html">Videos</a>
  </nav>
</header>
<main>
  <div id="error-banner" class="error-banner"></div>

  <div id="next-up-card" class="next-up" style="display:none;">
    <div class="label">Film this next</div>
    <div class="title" id="next-up-title"></div>
    <div class="meta" id="next-up-meta"></div>
  </div>

  <div id="candidates-section" style="display:none;">
    <h2 style="font-size:14px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold-bright);">New topic candidates</h2>
    <div id="candidates-body"></div>
  </div>

  <div class="toolbar">
    <button id="refresh-btn" class="primary">Refresh demand scores</button>
    <button id="discover-btn">Discover new topics</button>
    <button id="reload-btn">Reload</button>
  </div>

  <table id="topics-table" style="display:none;">
    <thead>
      <tr><th>Title</th><th>Entry point</th><th>Times covered</th><th>Demand score</th><th></th></tr>
    </thead>
    <tbody id="topics-body"></tbody>
  </table>
  <div id="empty-state" class="empty-state">Loading topics…</div>
</main>
<script src="app.js?v=20260828a"></script>
</body>
</html>
