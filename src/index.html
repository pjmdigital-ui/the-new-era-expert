<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New Era Expert — Content Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand">
    <img src="new-era-expert-logo.png" alt="The New Era Expert" class="logo">
    <span class="page-label">Content Dashboard</span>
  </div>
  <nav class="nav">
    <a href="index.html" class="active">Topics</a>
    <a href="videos.html">Videos</a>
  </nav>
</header>
<main>
  <div id="error-banner" class="error-banner"></div>

  <div id="next-up-card" class="next-up" style="display:none;">
    <div class="label">Film this next</div>
    <div class="title" id="next-up-title"></div>
    <div class="meta" id="next-up-meta"></div>
  </div>

  <div class="toolbar">
    <button id="refresh-btn">Refresh demand scores</button>
    <button id="discover-btn" class="primary">Discover new topics</button>
    <button id="reload-btn">Reload list</button>
  </div>

  <div id="candidates-section" class="section" style="display:none;">
    <h2>Discovered — needs review</h2>
    <div id="candidates-body"></div>
  </div>

  <table id="topics-table" style="display:none;">
    <thead>
      <tr>
        <th>Topic</th>
        <th>Entry point</th>
        <th>Times covered</th>
        <th>Demand score</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="topics-body"></tbody>
  </table>

  <div id="empty-state" class="empty-state">Loading topics…</div>
</main>

<script src="app.js"></script>
</body>
</html>
